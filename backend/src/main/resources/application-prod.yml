spring:
  datasource:
    url: jdbc:h2:mem:nutrivision_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
logging:
  level:
    root: INFO
    com.nutrivision: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://divyakj680-nutrivision-ai.onrender.com}
  ai-service:
    url: ${AI_SERVICE_BASE_URL:https://divyakj680-nutrivision-ai-service.onrender.com}
    timeout-ms: 180000





name: Keep Render Servers Awake

on:
  schedule:
    # Run every 10 minutes to prevent the 15-minute Render sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping AI Service
        run: curl -s https://divyakj680-nutrivision-ai-service.onrender.com/api/ai/health > /dev/null

      - name: Ping Backend Service
        run: curl -s https://divyakj680-nutrivision-backend.onrender.com/api/health > /dev/null

      - name: Ping Frontend Service
        run: curl -s https://divyakj680-nutrivision-ai.onrender.com > /dev/null
